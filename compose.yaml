# Producto completo (ver D-010). Funciona sin cambios en Docker y en Podman rootless.
# Las credenciales no están en el repositorio: vienen del archivo .env (ver .env.example).
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Los archivos publicados se colocan en data/publicados/ antes de levantar.
name: novamercado

x-producto: &producto
  image: localhost/novamercado:0.1.0
  build:
    context: .
    # Docker solo detecta "Dockerfile" por sí solo: el nombre debe indicarse.
    dockerfile: Containerfile
  environment: &entorno-producto
    NOVAMERCADO_DATOS: /datos/publicados
    NOVAMERCADO_BD_URL: postgresql+psycopg://${NOVAMERCADO_BD_USUARIO:?falta NOVAMERCADO_BD_USUARIO en .env (copie .env.example como .env)}:${NOVAMERCADO_BD_CLAVE:?falta NOVAMERCADO_BD_CLAVE en .env (copie .env.example como .env)}@bd-producto:5432/novamercado
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_DISABLE_AGENT_HINT: "1"
  volumes:
    - ./data/publicados:/datos/publicados:ro

# Airflow 3.3.2 adaptado a una laptop, como en el Lab 1 (D-011): LocalExecutor sin Celery ni Redis.
x-airflow: &airflow
  image: localhost/novamercado-airflow:3.3.2
  build:
    context: .
    dockerfile: Containerfile.airflow
  environment: &entorno-airflow
    <<: *entorno-producto
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_BD_USUARIO:?falta AIRFLOW_BD_USUARIO en .env (copie .env.example como .env)}:${AIRFLOW_BD_CLAVE:?falta AIRFLOW_BD_CLAVE en .env (copie .env.example como .env)}@bd-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY?falta AIRFLOW_FERNET_KEY en .env (copie .env.example como .env)}
    # Sin intervención manual: el DAG no puede quedar pausado al crearse.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/novamercado/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?falta AIRFLOW_JWT_SECRET en .env (copie .env.example como .env)}
    AIRFLOW__API_AUTH__JWT_ISSUER: novamercado
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Laptop: un reentrenamiento a la vez y un solo worker de la API de Airflow.
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__API__WORKERS: "1"
  volumes:
    - ./dags:/opt/novamercado/dags:ro
    - ./data/publicados:/datos/publicados:ro
    # Volumen y no carpeta: los logs son miles de archivos que OneDrive intentaría sincronizar.
    - logs-airflow:/opt/airflow/logs
  user: "50000:0"
  depends_on: &depende-airflow
    bd-airflow:
      condition: service_healthy
  restart: unless-stopped

services:
  # Base del producto: solicitudes, predicciones, correcciones y observaciones (D-004).
  bd-producto:
    image: docker.io/library/postgres:16.10
    environment:
      POSTGRES_USER: ${NOVAMERCADO_BD_USUARIO:?falta NOVAMERCADO_BD_USUARIO en .env (copie .env.example como .env)}
      POSTGRES_PASSWORD: ${NOVAMERCADO_BD_CLAVE:?falta NOVAMERCADO_BD_CLAVE en .env (copie .env.example como .env)}
      POSTGRES_DB: novamercado
    volumes:
      - bd-producto:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d novamercado"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Base de MLflow: experimentos, runs y Model Registry. Separada de la del producto.
  bd-mlflow:
    image: docker.io/library/postgres:16.10
    environment:
      POSTGRES_USER: ${MLFLOW_BD_USUARIO:?falta MLFLOW_BD_USUARIO en .env (copie .env.example como .env)}
      POSTGRES_PASSWORD: ${MLFLOW_BD_CLAVE:?falta MLFLOW_BD_CLAVE en .env (copie .env.example como .env)}
      POSTGRES_DB: mlflow
    volumes:
      - bd-mlflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mlflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    image: localhost/novamercado-mlflow:3.17.2
    build:
      context: .
      dockerfile: Containerfile.mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql+psycopg://${MLFLOW_BD_USUARIO:?falta MLFLOW_BD_USUARIO en .env (copie .env.example como .env)}:${MLFLOW_BD_CLAVE:?falta MLFLOW_BD_CLAVE en .env (copie .env.example como .env)}@bd-mlflow:5432/mlflow
      # Los artefactos los guarda y sirve el propio servidor: los clientes no comparten carpetas.
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artefactos
      # MLflow 3 rechaza los Host que no conoce (protección contra DNS rebinding): se agregan el
      # nombre del servicio en la red del compose y el acceso desde la máquina, sin desactivarla.
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
      - --workers=2
    environment:
      # El ejecutor de trabajos de MLflow 3 (evaluación de GenAI) no se usa y ocupa ~2 GB y una CPU.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      # Solo en la máquina: MLflow no tiene autenticación y la API deserializa los modelos que
      # registra; desde la red, cualquiera podría promover uno malicioso (D-010).
      - "127.0.0.1:5000:5000"
    volumes:
      - artefactos-mlflow:/mlflow/artefactos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      retries: 30
      start_period: 20s
    depends_on:
      bd-mlflow:
        condition: service_healthy
    restart: unless-stopped

  # Corre una vez: si no hay modelo vigente entrena y registra el primero; si ya hay, termina (D-009).
  entrenamiento-inicial:
    <<: *producto
    command: ["python", "-m", "novamercado.reentrenamiento", "--inicial"]
    depends_on:
      bd-producto:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    <<: *producto
    environment:
      <<: *entorno-producto
      NOVAMERCADO_COPIA_MODELO: /var/lib/novamercado/modelo/vigente.joblib
      NOVAMERCADO_AIRFLOW_URL: http://airflow-apiserver:8080
      NOVAMERCADO_AIRFLOW_USUARIO: ${AIRFLOW_USUARIO:?falta AIRFLOW_USUARIO en .env (copie .env.example como .env)}
      NOVAMERCADO_AIRFLOW_CLAVE: ${AIRFLOW_CLAVE:?falta AIRFLOW_CLAVE en .env (copie .env.example como .env)}
    ports:
      # El servicio del contrato: en todas las interfaces, para quien lo consuma.
      - "8000:8000"
    volumes:
      - ./data/publicados:/datos/publicados:ro
      - copia-modelo:/var/lib/novamercado/modelo
    healthcheck:
      # 200 con estado ok o degradado; 503 mientras no haya modelo.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      retries: 40
      start_period: 30s
    depends_on:
      bd-producto:
        condition: service_healthy
      # La API arranca aunque MLflow no esté listo: carga el modelo cuando aparezca.
      mlflow:
        condition: service_started
    restart: unless-stopped

  # Base de metadatos de Airflow, separada de la del producto como pide el enunciado.
  bd-airflow:
    image: docker.io/library/postgres:16.10
    environment:
      POSTGRES_USER: ${AIRFLOW_BD_USUARIO:?falta AIRFLOW_BD_USUARIO en .env (copie .env.example como .env)}
      POSTGRES_PASSWORD: ${AIRFLOW_BD_CLAVE:?falta AIRFLOW_BD_CLAVE en .env (copie .env.example como .env)}
      POSTGRES_DB: airflow
    volumes:
      - bd-airflow:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Migra la base de metadatos y crea el usuario que usa la API para disparar el DAG.
  airflow-init:
    <<: *airflow
    # Como root solo para dar el volumen de logs al usuario de Airflow; luego migra y crea el usuario.
    entrypoint: /bin/bash
    command: ["-c", "chown -R 50000:0 /opt/airflow/logs && exec /entrypoint airflow version"]
    user: "0:0"
    environment:
      <<: *entorno-airflow
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USUARIO:?falta AIRFLOW_USUARIO en .env (copie .env.example como .env)}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_CLAVE:?falta AIRFLOW_CLAVE en .env (copie .env.example como .env)}
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    ports:
      # Interfaz de administración: solo en la máquina (D-010).
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      <<: *depende-airflow
      airflow-init:
        condition: service_completed_successfully

  # Con LocalExecutor las tareas corren aquí: el reentrenamiento usa este contenedor.
  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *depende-airflow
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      <<: *depende-airflow
      airflow-init:
        condition: service_completed_successfully

volumes:
  bd-producto:
  bd-mlflow:
  artefactos-mlflow:
  copia-modelo:
  bd-airflow:
  logs-airflow:
