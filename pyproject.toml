[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "novamercado"
version = "0.1.0"
description = "Servicio de pronóstico diario de ventas para NovaMercado"
requires-python = ">=3.12,<3.13"
# Versiones exactas, iguales a las restricciones de Airflow 3.3.2: local, CI y
# contenedores usan las mismas librerías. Cada componente agrega las suyas en su PR.
dependencies = [
    "fastapi==0.136.3",
    "mlflow-skinny==3.17.2",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "psycopg[binary]==3.3.5",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "sqlalchemy==2.0.52",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
# alembic: lo necesita el MLflow sobre SQLite con el que las pruebas registran modelos sin servidor.
dev = ["alembic==1.20.0", "httpx==0.28.1", "pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
